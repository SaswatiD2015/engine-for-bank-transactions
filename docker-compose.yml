version: "3.9"

services:
  # Reverse Proxy — TLS termination and routing
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
      - api
    restart: unless-stopped

  # Dashboard — Streamlit presentation layer
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    expose:
      - "8501"
    depends_on:
      - postgres
    restart: unless-stopped

  # API — FastAPI metrics service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://analytics:analytics@postgres:5432/bank_analytics
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # PostgreSQL — Analytical storage
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bank_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d bank_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — Optional cache for expensive aggregate queries
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
